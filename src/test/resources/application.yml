# 테스트 전용 설정 — 실제 MySQL(baemin) 데이터를 건드리지 않도록 H2 인메모리 사용
# (src/test 아래에 두면 테스트 실행 시 src/main 의 application.yml 대신 이 파일이 우선 적용됨)
spring:
  datasource:
    # H2 인메모리 DB. 디스크 파일이 아니라 메모리(RAM)에만 존재해서 테스트가 끝나면 데이터가 사라짐
    #   jdbc:h2:mem:testdb     -> testdb 라는 이름의 메모리 DB 사용
    #   MODE=MySQL             -> MySQL 문법과 최대한 비슷하게 동작 (운영 MySQL 과 동작 차이를 줄이려는 목적)
    #   DB_CLOSE_DELAY=-1      -> 마지막 커넥션이 닫혀도 DB 를 바로 비우지 않고 JVM 이 살아있는 동안 유지
    #   DB_CLOSE_ON_EXIT=FALSE -> JVM 종료 시 H2 가 임의로 DB 를 닫지 않도록 함 (커넥션 풀이 정리하도록 위임)
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa                       # H2 의 기본 관리자 계정명
    password:                          # 비밀번호 없음 (테스트용 인메모리라 보안 불필요)
    # driver-class-name 생략: Spring Boot가 url의 jdbc:h2: 접두사로 H2 드라이버 자동 판별

  jpa:
    hibernate:
      # 엔티티(@Entity) 기준으로 테이블을 다룰 때의 전략
      #   create-drop = 테스트 시작 시 테이블을 새로 만들고(create), 끝날 때 모두 삭제(drop)
      #   -> 매 테스트가 깨끗한 빈 DB 에서 시작되므로 테스트끼리 데이터가 섞이지 않음
      ddl-auto: create-drop
    show-sql: true                     # 실행되는 SQL 을 콘솔에 출력 (테스트 디버깅용)
    properties:
      hibernate:
        format_sql: true               # 위 SQL 을 보기 좋게 줄바꿈/들여쓰기 해서 출력
        dialect: org.hibernate.dialect.H2Dialect   # Hibernate 가 H2 에 맞는 SQL 을 생성하도록 방언(dialect) 지정
        # 'user'는 H2 예약어라 create table user 가 문법 오류로 깨짐 → 예약어인 식별자를 자동으로 따옴표 처리("user")
        auto_quote_keyword: true
    # OSIV(Open Session In View) 끄기.
    #   false = 트랜잭션(서비스 계층)이 끝나면 영속성 컨텍스트도 닫힘.
    #   -> 컨트롤러/뷰 단계에서 LAZY 연관을 무심코 조회하면 예외가 나므로, 지연 로딩 문제를 테스트에서 일찍 드러냄
    open-in-view: false

  # Redis 연결 정보(테스트용). 커넥션은 실제 사용 시점에 맺으므로, contextLoads 테스트는 Redis가 안 떠 있어도 통과
  data:
    redis:
      host: localhost
      port: 6379          # 포트 = host(localhost) 안에서 '어느 서비스'에 연결할지 가리키는 번호. 6379 = Redis 기본(관례) 포트 → "이 PC의 6379번 Redis에 접속"

# JWT 설정(테스트용). @SpringBootTest 가 전체 컨텍스트를 띄울 때 jwt.secret 이 필요해 여기에도 둔다.
jwt:
  secret: test-secret-please-change-this-to-32bytes-or-longer-for-hs256
  access-token-validity-seconds: 1800
  refresh-token-validity-seconds: 1209600
