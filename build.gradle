plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kuit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Security + JWT
    //  - starter-security: SecurityFilterChain·@EnableWebSecurity 등 보안 핵심(spring-security-config/web)
    //  - oauth2-resource-server: Bearer 토큰(JWT) 검증/발급용 Nimbus 기반 JwtDecoder·JwtEncoder 포함
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Redis — RefreshToken 저장소 (TTL 자동만료·회전). 실행 전 로컬에 Redis가 떠 있어야 함
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Swagger (springdoc-openapi) — Spring Boot 3.5 호환
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}

// @PathVariable / @RequestParam 파라미터명 보존 (Spring Boot 3.2+ 권장)
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-parameters']
}
